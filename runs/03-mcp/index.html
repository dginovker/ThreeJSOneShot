<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Driftlands</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2357a2e2'/%3E%3Cellipse cx='16' cy='22' rx='11' ry='5' fill='%23a9743f'/%3E%3Cellipse cx='16' cy='17' rx='12' ry='5' fill='%237cc23c'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #79baec; }
      body { font-family: ui-rounded, "SF Pro Rounded", Avenir, system-ui, sans-serif; }
      canvas { display: block; }

      /* Cheap vignette: keeps the eye on the middle of the frame and grounds the
         bright sky at the corners without costing a post-processing pass. */
      #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 2;
        background:
          radial-gradient(ellipse 78% 70% at 50% 46%, rgba(0,0,0,0) 55%, rgba(35,18,6,.42) 100%),
          linear-gradient(to bottom, rgba(255,214,150,.10), rgba(0,0,0,0) 22%);
      }

      #loading {
        position: fixed; inset: 0; display: grid; place-content: center; z-index: 5;
        background: linear-gradient(#8fc6ef, #f6cd9d); color: #43301c;
        font-size: 15px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
      }
      #loading b { display: block; font-size: 64px; letter-spacing: 10px; margin-bottom: 14px; }

      #fatal {
        position: fixed; inset: 0; display: none; z-index: 10; overflow: auto;
        padding: 24px; box-sizing: border-box; background: #1a0f12; color: #ffb4b4;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="loading"><b>DRIFTLANDS</b>Loading the sky islands…</div>
    <div id="vignette"></div>
    <pre id="fatal"></pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
