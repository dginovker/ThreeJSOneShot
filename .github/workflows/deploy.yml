name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runs/*/package-lock.json

      - name: Build every run into its own subdirectory
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/
          for dir in runs/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            (cd "$dir" && npm ci && npm run build)
            # A run that builds but emits nothing would publish a blank page
            # that looks deployed. Fail instead.
            test -f "$dir/dist/index.html" || { echo "$name produced no index.html"; exit 1; }
            cp -r "$dir/dist" "dist/$name"
            echo "::endgroup::"
          done
          echo "published:"; ls -1 dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
